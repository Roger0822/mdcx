name: Build macOS app with LTX watermark

on:
  workflow_dispatch:
  push:
    branches:
      - fix/javdb-actors
      - fix/jellyfin-auth
      - fix/ltx-watermark
      - codex/ltx-mosaic-priority

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Install FFmpeg build dependencies
        run: brew install ffmpeg pkg-config

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Test actor scraping, Jellyfin authentication, and LTX recognition
        run: |
          uv run pytest tests/crawlers/test_parsers.py -k 'javdb_current_actor_markup or javdb_legacy_actor_markup'
          uv run pytest tests/test_jellyfin_auth.py
          uv run pytest tests/test_ltx.py

      - name: Build Apple Silicon DMG
        run: uv run scripts/build.py --create-dmg --version 220261104.2 --debug

      - uses: actions/upload-artifact@v4
        with:
          name: MDCx-macOS-arm64-${{ github.sha }}
          path: dist/MDCx.dmg
          if-no-files-found: error
